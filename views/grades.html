<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Grades</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <style>
        #changeGradeBtn{
            display: block;
            margin: auto;
            margin-top: 10px;
            padding: 5px;
            background-color: blanchedalmond;
            cursor: pointer;
            border: 1px solid;
            border-radius: 2px;
            &:hover{
                background-color: hsl(36, 100%, 95%);
            }
            &:active{
                background-color: hsl(36, 100%, 100%);
            }
        }
        .gradeEntry {
            padding: 0;
            width: 50%;

        }
        .gradeEntry input{
            display: inline-block;
            width: 100%;
            height: 100%;
            color: black;
            border: none;
            padding-left: 5px;
            &:focus{
                background-color: cornsilk;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Grades</h1>
    </header>
    <nav>
        <ul>
            <li id="logo"><img src="../graphics/logo.png" alt="logo" width="40px"></li>
            <a href="index.html"><li>Home</li></a>
            <a><li>Profile</li></a>
            <a><li>Help</li></a>
        </ul>
    </nav>
    <main>
        <h2>View student grades</h2>
        <div id="nameInput" class="inputContainer">
            <label>Student Name:</label>
            <input id="entry">
            <button onclick="fetchGrades()">Enter</button>
        </div>
        <hr>
        <div class="container" id="output">
            <h3>No data</h3>
            Enter student's name to view grades.
        </div>
        <h3 style="text-align: center;" id="message">Waiting</h3>
    </main>
    <footer>
        <h4>footer</h4>
    </footer>
    <script src="scripts/load.js"></script>
    <script src="scripts/grades.js"></script>
</body>
</html>
